name: ZOX Autopilot Agent

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Clone Repository Code
      uses: actions/checkout@v4

    - name: Provision Python Runtime environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache and Install System Requirements
      run: |
        python -m pip install --upgrade pip
        pip install langchain langchain-core langchain-google-genai pydantic beautifulsoup4 requests pypdf lxml tavily-python python-dotenv

    - name: Run Automation Agent Script
      env:
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        GEMINI_PRIMARY_KEY: ${{ secrets.GEMINI_PRIMARY_KEY }}
        GEMINI_BACKUP_KEY: ${{ secrets.GEMINI_BACKUP_KEY }}
        YOUR_TAVILY_API_KEY: ${{ secrets.YOUR_TAVILY_API_KEY }}
      run: python "email assist.py"
